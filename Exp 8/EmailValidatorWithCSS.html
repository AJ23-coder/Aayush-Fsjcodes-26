<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d8;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #555;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Email Validator</h1>

        <label for="email">Email Address</label>

        <input
            type="text"
            id="email"
            placeholder="Enter your email"
        >

        <button onclick="validateEmail()">Validate</button>

        <div id="result">--</div>
    </div>

    <script>
        function validateEmail() {
            const emailEle = document.querySelector("#email");
            const resultEle = document.querySelector("#result");

            const email = emailEle.value;

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailRegex.test(email)) {
                resultEle.innerText = "✓ Valid Email";
                resultEle.style.color = "#15803d";
                resultEle.style.background = "#dcfce7";
            } else {
                resultEle.innerText = "✕ Invalid Email";
                resultEle.style.color = "#dc2626";
                resultEle.style.background = "#fee2e2";
            }
        }
    </script>

</body>
</html>
